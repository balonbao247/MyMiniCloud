<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyMiniCloud - Web Server 2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            min-height: 100vh; display: grid; place-items: center; padding: 24px;
            color: #ecfdf5; background: #04100c; overflow: hidden;
        }
        .aurora { position: fixed; inset: -20%; z-index: -1; filter: blur(50px);
            background:
                radial-gradient(40% 35% at 25% 25%, rgba(16,185,129,.55), transparent 70%),
                radial-gradient(35% 40% at 80% 20%, rgba(45,212,191,.40), transparent 70%),
                radial-gradient(45% 40% at 65% 85%, rgba(250,204,21,.22), transparent 70%);
            animation: move 18s ease-in-out infinite alternate; }
        @keyframes move { to { transform: translate(-4%, 4%) rotate(-6deg) scale(1.08); } }
        .card {
            width: min(560px, 100%); text-align: center; padding: 54px 40px; border-radius: 28px;
            background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.14);
            backdrop-filter: blur(20px); box-shadow: 0 30px 70px -20px rgba(0,0,0,.7), 0 0 80px -30px #10b981;
            animation: rise .9s cubic-bezier(.2,.7,.2,1) both;
        }
        @keyframes rise { from { opacity: 0; transform: translateY(40px) scale(.96); } }
        .pill { display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px; border-radius: 999px;
            font-size: .8rem; font-weight: 700; background: rgba(16,185,129,.15); border: 1px solid rgba(16,185,129,.4); color: #6ee7b7; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; animation: ping 1.8s infinite; }
        @keyframes ping { 70% { box-shadow: 0 0 0 10px rgba(52,211,153,0); } 0% { box-shadow: 0 0 0 0 rgba(52,211,153,.7); } }
        .icon { font-size: 3.4rem; margin: 26px 0 8px; display: inline-block; animation: float 4s ease-in-out infinite; }
        @keyframes float { 50% { transform: translateY(-8px) rotate(-5deg); } }
        h1 { font-size: clamp(1.7rem, 5vw, 2.3rem); font-weight: 800; line-height: 1.2; letter-spacing: -.03em; margin-bottom: 14px;
            background: linear-gradient(120deg, #34d399, #2dd4bf 55%, #facc15); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: #a7c4b8; line-height: 1.7; margin-bottom: 30px; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 30px; }
        .stat { padding: 16px; border-radius: 16px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); }
        .stat small { display: block; color: #6b8f80; font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; }
        .stat b { font-size: 1.05rem; }
        .btn { display: inline-block; padding: 14px 30px; border-radius: 999px; font-weight: 800; color: #04100c; text-decoration: none;
            background: linear-gradient(120deg, #34d399, #2dd4bf); box-shadow: 0 12px 30px -8px #10b981; transition: transform .25s, box-shadow .25s; }
        .btn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 18px 38px -8px #10b981; }
    </style>
</head>
<body>
    <div class="aurora"></div>
    <div class="card">
        <span class="pill"><span class="dot"></span> Upstream Node Replica #2</span>
        <div class="icon">🌿</div>
        <h1>Hello from Web Server 2 (Load Balanced)</h1>
        <p>Phản hồi từ Node Replica thứ 2 thông qua Nginx Upstream Round-Robin.</p>
        <div class="stats">
            <div class="stat"><small>Thuật toán</small><b>Round-Robin</b></div>
            <div class="stat"><small>Trạng thái</small><b style="color:#34d399">● Healthy</b></div>
        </div>
        <a href="/" class="btn">↻ Tải lại để thử Load Balancing</a>
    </div>
</body>
</html>
